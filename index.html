<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Plus Gestão</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Tela de login -->
  <div class="login-wrap" id="login-screen">
    <div class="login-card">
      <div class="login-mark">1+</div>
      <h1>One Plus Gestão</h1>
      <div class="sub">Entre com o e-mail e senha cadastrados pela sua equipe.</div>
      <form id="login-form">
        <div class="field" style="margin-bottom:12px;">
          <label>E-mail</label>
          <input type="email" id="login-email" required autocomplete="username">
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label>Senha</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" id="login-btn" style="width:100%;">Entrar</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- App -->
  <div class="app" id="app-shell" style="display:none;">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">1+</div>
        <div>
          <div class="name">One Plus</div>
          <div class="sub">Gestão</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="whoami">
        <div class="email" id="current-email"></div>
        <button class="btn-logout" id="btn-logout">Sair</button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div id="modal-root"></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
